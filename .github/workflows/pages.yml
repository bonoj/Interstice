name: Publish Interstice

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Publication is ordered. A newer source commit may wait, but it must not cancel
  # a deployment already crossing the public membrane and leave Pages serving an
  # arbitrarily old completed revision during rapid iteration.
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed Betwixt provenance
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          expected="$(tr -d '\r\n' < betwixt/.repository-sha)"
          test "${#expected}" = 40
          build="${expected:0:8}"
          url="${PAGE_URL%/}/betwixt/?verify=${expected}"
          for attempt in {1..12}; do
            body="$(curl --fail --silent --show-error --location --header 'Cache-Control: no-cache' "$url" || true)"
            if grep -Fq "data-repository-sha=\"${expected}\"" <<<"$body" &&
               grep -Fq "data-repository-build=\"${build}\"" <<<"$body"; then
              echo "LIVE Betwixt build ${build}: public Pages serves exact Repository ${expected}."
              exit 0
            fi
            echo "NOT LIVE YET: public Pages does not serve Betwixt build ${build} (attempt ${attempt}/12)."
            sleep 5
          done
          echo "NOT LIVE: public Pages failed exact provenance/build verification for Betwixt ${build}." >&2
          exit 1
