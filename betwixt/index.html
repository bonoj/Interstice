    button?.setAttribute("aria-pressed",raised?"true":"false");
    const marble=registered.get("marble");
    marble?.classList.remove("active");marble?.setAttribute("aria-pressed","false");
  }

  function spinPresences(){
    const world=globalThis.vestibule;
    if(!world?.presences?.length)return;
    const start=performance.now(),duration=1800,turns=2;
    const base=world.presences.map(o=>o.rotation.y);
    const tick=now=>{
      const raw=Math.min(1,(now-start)/duration);
      const t=1-Math.pow(1-raw,3);
      world.presences.forEach((o,i)=>{o.rotation.y=base[i]+Math.PI*2*turns*t});
      world.invalidate?.();
      if(raw<1)requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }

  for(const spell of spells.temporary)registerTool({...spell,lane:"temporary"});
  for(const spell of spells.resident)registerTool({...spell,lane:"resident"});

})();</script>

<script type="text/plain" id="vestibule-semantics">
WORLD LAB VESTIBULE — SIX CITIES IDENTITY + CONTEXTUAL ACTIONS T0

VISIBLE COPY T41
Persistent display copy is reduced to WORLD LAB only. The former VESTIBULE · WORLDSPACE T0 subtitle and upper-right diagnostic/counter copy are retired.
T41 removed the counter DOM but left applyRing() writing directly to that retired node, and the visible startup diagnostics correctly caught the null textContent write. T42 removes that stale write while preserving ring/profile behavior. Contextual action labels remain interaction controls and appear only when a lab is foregrounded.

ROLE
The vestibule is a spatial threshold between the World Lab landing surface and
independent executable labs. It owns departure; each destination lab owns arrival.

WORLD SPACE
The current world is intentionally quiet and identity-neutral:
- a broad matte white-grey plane;
- a warm-neutral dome whose value remains close to, but distinct from, the plane;
- five identical presences hovering clearly above the plane;
- soft static shadows that establish the presences as things occupying a place.
- a centered static overhead skylight; no directional lighting movement.
- restrained distance fog begins only near the outer world, softening the floor/dome
  horizon without washing out the presences during ordinary or far inspection.
There are no paths, pedestals, landmarks, environmental animation, or moving light.
The dome is the lateral/upper visual extent and observer constraint. The floor is
also a hard observer boundary: the camera may approach it but never pass through it.
Zoom itself has no arbitrary near/far leash; observer travel is governed by the
physical world bounds instead. When pinch zoom reaches the dome boundary, continued
pinch-out is clamped along the same viewing direction and must not become orbit.

TOPOLOGY
Five presences occupy a circular ring around a shared center. The ring is phased edge-forward so the initial view meets the flat span between
two neighboring presences rather than a single vertex, without changing the earned
observer home pose. Ring earned itself
during the topology expedition and is now ordinary vestibule structure.

SELECTION GRAMMAR
- Tap a presence: it leaves its ring slot and travels toward the observer, settling
  8.5 world units in front of the camera with a slight camera-relative lift.
- Camera attention shifts to the arriving presence and remains locked to it.
- Pinch/wheel zoom and orbit remain available around the foregrounded presence.
- Selection snapshots the complete pre-selection observer pose.
- Tap away reverses the presence and restores that exact pose.
- A larger invisible interaction shell improves mobile acquisition without changing
  the visible presence.
- Only one presence can be foregrounded at a time.

CONTEXTUAL ACTIONS
Foregrounding an assigned lab reveals a small screen-space action stack anchored stably
at bottom center with safe-area breathing room. ENTER LAB is primary; GITHUB is secondary
provenance. The controls deliberately do not follow the physical presence: orbit and zoom
remain visually free so the user can inspect the project marble without UI jitter or pursuit.
Their fill matches the ground material, making the floor/substrate the visual source of
interface rather than introducing a separate HTML-white or glass layer.
Visibility is driven directly by foreground state. The unassigned control presence exposes
no actions.

ENTRY
ENTER LAB invokes the established Camera Commit: the observer moves rapidly toward the
foregrounded presence, then navigates to Destination. Navigation authority belongs to
the explicit contextual action rather than a second tap on the physical object.

ACTION-ANCHOR CORRECTION
A projected object-relative action tether was implemented and rejected under touch inspection:
small camera/orbit changes made the menu jitter and visually chase the marble. The action stack
is therefore viewport-owned, fixed at bottom center. Physical inspection and interface stability
are intentionally decoupled.

BACK / WORLD CONTINUITY
World Lab owns one versioned session WorldState. It persists semantic simulation state rather than
Three.js representation: observer/focus state; Vertical Accretion route, stock/path progress, worker
run, RNG and spoil physics; Foundry drones plus stable references to shared spoil; and Six Cities
exchange scheduler, RNG and active packet progression. Meshes/groups remain disposable views and are
reconstructed from that state when the document is rebuilt. BFCache may preserve the live ECS world
as an optimization, but it no longer defines continuity.

WorldState is a continuity boundary, not a new owner of every simulation. Each identity system retains
its behavioral authority. Cross-system coupling occurs through the smallest shared semantic facts that
have earned persistence. The current important example is spoil: Vertical Accretion produces physical
spoil with stable identity; Foundry may independently claim, carry, and remove that same spoil; WorldState
preserves the identity and relationship without making either system own the other's behavior. Stable
identity is introduced only where restoration of a real relationship requires it.

Navigation is deliberately outside WorldState. ENTER LAB checkpoints the stable inspection state
before Camera Commit, then Camera Commit runs. finishEntry consumes
entryMotion before assigning location.href. A BFCache return therefore cannot resume a completed
Camera Commit and phantom-enter the same lab. pagehide/visibility lifecycle saves are suppressed only once navigation begins
during sealed departure so the terminal commit camera cannot overwrite the inspection checkpoint.
On pageshow from BFCache only ephemeral motion/departure state is cleared; on document reconstruction
the versioned WorldState rebuilds meaningful world identity. Session storage intentionally limits
continuity to the current tab/session rather than creating a permanent save game.

CONTINUITY ARCHAEOLOGY
The predecessor used a one-shot return snapshot containing only foreground presence and observer pose.
That solved reconstructed Back framing but left simulation identity dependent on BFCache. More
importantly, Camera Commit left its completed entryMotion live across navigation. BFCache restored that
executable departure intent; the resumed animation loop immediately called finishEntry again, producing
the observed World Lab flash followed by automatic re-entry and a damaged-feeling Back sequence.
The repair separates durable world state from ephemeral commands and makes departure exactly-once.

APPARATUS UI RETIREMENT
The persistent lower-right Home/apparatus control was removed after camera interaction became
bounded, reversible, and transactionally restored by the selection grammar. The user no longer
needs a recovery control for ordinary camera exploration; permanent chrome would only advertise
a failure mode the apparatus has already solved.
The first retirement pass removed the Home DOM node but left a later direct onclick binding,
which correctly failed visibly at startup. That stale binding was removed; the programmatic
home() helper may remain available for diagnostics without requiring visible UI.

PRECONNECT
Foreground focus is a declaration of interest. If the entity owns a Destination,
the vestibule preconnects to its origin. This is intentionally the only preload
behavior: the preload expedition found speculative destination execution harmful
to vestibule frame rate and not meaningfully beneficial to arrival. Lab startup
experience belongs to the lab.

ECS OWNERSHIP
The vestibule uses a deliberately minimal ECS substrate.
Entity identity and semantic components are independent of rendering. Transform owns
world data. Three.js Object3D instances live only in RenderObject. RenderSyncSystem is
the one-way bridge from authoritative data to views. Views remain dumb.
LabIdentity and Destination own lab information; no lab-specific view classes exist.
ExchangeIdentity owns the first project-derived behavioral vocabulary. A generic
ExchangeSystem materializes its fittings and packet traffic; the Six Cities entity
supplies only data.

IDENTITY PROBE — SIX CITIES
Six Cities alone has earned a first physical mutation while the other presences remain
neutral controls. Its neutral sphere is retained. Six small octagonal metal fittings
are attached at the four equatorial cardinal points and two poles. Sparse deterministic
five-bearing material packets travel on raised spherical arcs between fittings. Each
packet is a clearly separated five-bearing train with the size rhythm
teeny -> tiny -> small -> tiny -> teeny. The center is the largest bearing, but even
it remains smaller than the previous probe's largest bearings. Each bearing owns its
own passage lifecycle: it appears only when its staggered departure begins, traverses
the complete arc at the common packet speed, and disappears individually on reaching
the destination fitting. Route ownership persists until the final bearing arrives.
Packets choose deterministically among four terrain-derived material colors: forest
green, warm sand/gold, pale stone, and water cyan. The underlying Six Cities presence remains the same opaque neutral white sphere as every
other project presence. Its fittings are bright warm honey-brass, deliberately biased by
material color rather than scene lighting. Each of the six octagonal fittings carries its
own tiny translucent light-blue glass dome, derived from Reservoir City's containment
architecture. Each dome is constructed from the brass interface rather than independently:
each dome is a true hemisphere whose diameter is deliberately narrower than the
octonut top, leaving a slim breathing annulus of warm brass around the glass. Its
equatorial rim plane sits slightly below the brass top face, so the dome remains
physically socketed with no hover gap. These are local structures attached to the six loci, not a shell around the
whole project orb. Other project presences remain opaque neutral white controls. Bearings, fittings, and
shell participate in the scene's physical lighting and shadows.

Implementation archaeology: the first shell probe attempted to access RenderObject
during entity construction before that component had been installed, causing startup
to fail visibly. Shell appearance/materialization now occurs in the post-construction
ExchangeIdentity + RenderObject pass, preserving component ownership and startup order.
That whole-orb shell interpretation was subsequently rejected: the canonical white
presence is restored unchanged. Translucency now belongs only to six tiny hemispherical
domes mounted on the brass fittings.
Traffic is intentionally lumpy but somewhat busier: quiet gaps, isolated transfers,
and occasional simultaneous exchanges. Orthogonal/nonintersecting routes may overlap in
time; only physically conflicting arc crossings are reserved out. There are no labels,
trails, glows, miniature scenery, or explanatory UI. The mechanism is evidence of six loci exchanging matter, not an
illustration of six cities.


IDENTITY PROBE — FOUNDRY T2
Foundry retains the canonical neutral white presence. Its first physical tether is a deliberately
tiny beige drone factory socketed into the marble: squat warm-beige body, orange cap, and a black
rectangular front mouth represented by an almost-flush outset. The previously proposed side poles
were rejected as visual invention and removed.

The factory now earns one verb: retrieve. Fifteen little orange true-cube drones belong to each factory. They emerge from the black mouth, claim
the nearest unclaimed Vertical Accretion spoil rock, and actively pursue that physical rock even while
it is still falling or bouncing. Claiming reserves a target but does not freeze its physics. On contact,
the drone picks up that same object and carries it home. Drones treat presence surfaces and the factory as solid obstacles, round them rather than clipping through them, and return through a broad front-door staging corridor before entering the black mouth, giving the factory a visibly generous berth and preventing corner traps. The rock leaves the world only at the factory mouth. Cargo return is an explicit world-space waypoint path around obstructing presence spheres; generic tangent repulsion is not used after pickup. The terminal factory approach remains live and the route is rebuilt if the Foundry presence materially moves. The factory body grows upward while its seated floor plane stays fixed, giving the black bay more vertical breathing room.
Claims prevent dogpiling. No processing or output is implied yet.

ARCHAEOLOGY — FOUNDRY IDENTITY
The older Foundry world supplies perceptual grammar rather than a scene to reproduce. Towers,
lavender structures, cable machinery, terrain, and processing systems remain withheld. T1 made the
factory too large and added unsupported skinny side poles; both were rejected. T2 makes the factory
smaller and beiger, removes the poles, and lets retrieval behavior carry the identity.

IDENTITY PROBE — ORBITAL CONSTRUCTION T1
Orbital Construction retains the canonical neutral white presence, but its project identity does not
sit on the marble. A distilled station orbits around it. The station is derived from the actual
Orbital Construction lab vocabulary: a compact pale-grey central hub, orthogonal cylindrical pressure
arms, asymmetric boxy habitation/workshop masses, a vertical mast, dark readable collars/structure,
very thin orange routed pipes/rails, and a few tiny warm inhabited windows. It is intentionally not a
miniature catalog of all thirty-seven module kinds and does not reproduce a finished composition.
The station follows a slow wandering elliptical orbit with no visible orbit line. The ellipse plane,
eccentricity, and attitude drift gently and independently over long periods, so the construction reads
from changing aspects without becoming frantic. The marble remains the canonical presence substrate;
the station is the lab's first identity evidence in the space around it.

ARCHAEOLOGY — ORBITAL IDENTITY
The source lab's executable and semantic surface were inspected before this probe. Earned visual
grammar includes cool white/light-grey hulls, dark readable mechanical structure, orthogonal modular
construction, thin orange framework/service routing, and scarce warm inhabited interiors. The vestibule
does not import scene-specific machinery, module encyclopedias, or unearned construction behavior.

IDENTITY PROBE — VERTICAL ACCRETION T28
Vertical Accretion retains the canonical neutral white presence. A small block worker begins
at a deterministic pseudo-random staging point with a broad finite pile of seventy-two actual
wooden steps. The worker may not shortcut across the sphere to fetch material: every supply
run retraces the graph of steps already constructed. He walks frontier -> built graph -> stock,
carries one plank back across that same graph, and only then installs the new transverse step.
The growing path therefore makes its own extension progressively more expensive in travel.
A tiny torch begins beside each woodpile/restock site. Sparse additional torches are finite infrastructure attached to the path and cast tiny local illumination.
When stock is exhausted, the worker retraverses the graph to its frontier, removes the final
step, carries it home over the graph that remains, and repeats until the topology collapses
back to the stockpile. He then chooses another deterministic pseudo-random staging route and
starts again. The worker is a pictographic cream figure with a sphere head, subtly tapered cylinder body,
no arms, and two nearly adjacent stubby grey legs slightly aft of centerline. Large warm-white spoil bearings use the original
legible rubble scale, remain persistent physical consequence, and deliberately cast no shadows.

ARCHAEOLOGY — VERTICAL ACCRETION IDENTITY
Dark excavation channels failed to read as true cuts at marble scale. Permanent cuts and
torches also accumulated toward ornamental end states. A direct stock-to-frontier spherical
shuttle then exposed a deeper lie: finite lumber was physical, but the worker ignored the
access topology it created. T27 makes constructed steps authoritative traversal edges. The
worker now pays the logistics cost of his own growing graph; dismantling is its physical inverse.

LAB ENTITIES
Four presences currently own destinations:
- Foundry -> https://bonoj.github.io/Foundry/
- Six Cities -> https://bonoj.github.io/SixCities/
- Vertical Accretion -> https://bonoj.github.io/VerticalAccretion/
- Orbital Construction -> https://bonoj.github.io/OrbitalConstruction/
The fifth presence remains deliberately unassigned and is not pre-named.

ARCHAEOLOGY
A 16-layout probe earned Ring. Transition probes earned Camera Commit. Preload probes
compared none, preconnect, document prefetch, and warm iframe; Preconnect earned
promotion. Warm iframe caused severe transient frame-rate collapse and did not improve
the destination's meaningful render time. Experimental selectors and alternate
implementations were removed after promotion rather than retained as dormant product UI.

RUNTIME
Dirty-on-change rendering except during bounded motion. Pixel ratio capped at 1.5.
Startup/runtime/promise/WebGL/shader failures remain visibly diagnostic.

WORKING RULE
Attention brings a presence to the observer. Commitment carries the observer to the lab.
</script>

<script>
const labActionsEl=document.getElementById('labActions');
const enterLabEl=document.getElementById('enterLab');
const githubLabEl=document.getElementById('githubLab');

window.vestibuleFail=(scope,e)=>{
  clearTimeout(window.vestibuleWatch);
  const f=document.getElementById('fault');
  f.style.display='block';
  f.textContent='WORLD LAB VESTIBULE — '+scope+'\n'+(e?.stack||e?.message||String(e));
};
addEventListener('error',e=>vestibuleFail('startup / runtime',e.error||e.message));

<script type="module">

function createWorld(){

const presenceEntities=PRESENCES.map((entry,slot)=>{

});
// ORBITAL CONSTRUCTION IDENTITY T1 — distilled lab geometry in a wandering ellipse.
const orbitalStates=new Map();
const orbitalHullMat=new THREE.MeshStandardMaterial({color:0xcfd3d1,roughness:.58,metalness:.16});
const orbitalHull2Mat=new THREE.MeshStandardMaterial({color:0xaeb6b6,roughness:.62,metalness:.13});
const orbitalDarkMat=new THREE.MeshStandardMaterial({color:0x4d5659,roughness:.56,metalness:.28});
const orbitalOrangeMat=new THREE.MeshStandardMaterial({color:0xd8782c,roughness:.48,metalness:.20});
const orbitalWindowMat=new THREE.MeshStandardMaterial({color:0xffc66e,emissive:0xffa33a,emissiveIntensity:1.35,roughness:.40,metalness:0});
function cylBetween(parent,a,b,r,mat,segments=8){
  const d=b.clone().sub(a),m=a.clone().add(b).multiplyScalar(.5);
  const mesh=new THREE.Mesh(new THREE.CylinderGeometry(r,r,d.length(),segments),mat);
  mesh.position.copy(m);mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.clone().normalize());
  mesh.castShadow=true;parent.add(mesh);return mesh;
}

  const m=new THREE.Mesh(new THREE.BoxGeometry(size.x,size.y,size.z),mat);m.position.copy(pos);m.castShadow=cast;parent.add(m);return m;
}
function addWindows(parent,pos,axis='x'){
  for(let i=-1;i<=1;i++){
    const p=pos.clone();
    if(axis==='x')p.x+=i*.045;else p.z+=i*.045;
    const w=box(parent,new THREE.Vector3(axis==='x'?.025:.006,.018,axis==='x'?.006:.025),p,orbitalWindowMat,false);
  }
}
function addPipe(parent,points){

}
function buildOrbitalIdentity(id,data){
  const root=C.RenderObject.get(id)?.object;if(!root)return;

  const station=new THREE.Group();orbitRoot.add(station);

  hub.rotation.x=Math.PI/2;hub.castShadow=true;station.add(hub);  const arms=[

    [new THREE.Vector3(0,0,-.07),new THREE.Vector3(0,0,-.23)]

  box(station,new THREE.Vector3(.17,.13,.15),new THREE.Vector3(.39,.015,0),orbitalHullMat);
  box(station,new THREE.Vector3(.15,.115,.14),new THREE.Vector3(0,.005,.34),orbitalHull2Mat);
  box(station,new THREE.Vector3(.13,.10,.12),new THREE.Vector3(-.34,-.005,0),orbitalHullMat);

  drum.rotation.z=Math.PI/2;drum.position.set(0,0,-.30);drum.castShadow=true;station.add(drum);

  box(station,new THREE.Vector3(.13,.12,.12),new THREE.Vector3(0,.34,0),orbitalHullMat);
  cylBetween(station,new THREE.Vector3(0,.40,0),new THREE.Vector3(0,.47,0),.018,orbitalDarkMat,8);
  // Thin orange service piping: accent, never structure.
  addPipe(station,[new THREE.Vector3(-.25,.052,.040),new THREE.Vector3(.28,.052,.040),new THREE.Vector3(.28,.052,.075)]);
  addPipe(station,[new THREE.Vector3(.040,.050,-.20),new THREE.Vector3(.040,.050,.26)]);
  addPipe(station,[new THREE.Vector3(.052,.08,.025),new THREE.Vector3(.052,.40,.025)]);
  // Sparse inhabited evidence.
  addWindows(station,new THREE.Vector3(.39,.02,.076),'x');
  addWindows(station,new THREE.Vector3(.076,.01,.34),'z');
  addWindows(station,new THREE.Vector3(-.34,.005,.061),'x');

}
for(const id of ecs.query(C.OrbitalIdentity,C.RenderObject))buildOrbitalIdentity(id,C.OrbitalIdentity.get(id));
function OrbitalSystem(now){
  const t=now*.000075;
  for(const st of orbitalStates.values()){
    st.root.updateWorldMatrix(true,false);
    const center=st.root.getWorldPosition(new THREE.Vector3());
    // Wandering ellipse: slow precession and gentle eccentricity breathing.
    const a=st.data.orbitRadius*(1+.055*Math.sin(t*.37+.8));
    const b=a*(.72+.055*Math.sin(t*.29+1.9));
    const u=t+st.phase;
    const local=new THREE.Vector3(a*Math.cos(u),.18*Math.sin(u*.53),b*Math.sin(u));
    const q=new THREE.Quaternion().setFromEuler(new THREE.Euler(
      .38+.16*Math.sin(t*.19),
      .26*Math.sin(t*.13+1.2),
      .18+.12*Math.sin(t*.17+.4)

    local.applyQuaternion(q);
    st.orbitRoot.position.copy(center).add(local);
    // Independent quiet attitude drift so the asymmetric construction reveals itself.
    st.station.rotation.set(.20+.10*Math.sin(t*.31),t*.43,.12*Math.sin(t*.23));
    window.vestibuleDirty=true;

}

// FOUNDRY IDENTITY T9 — explicit cargo return paths; taller factory preserves its seated floor.
const foundryStates=new Map();
const foundryBodyMat=new THREE.MeshStandardMaterial({color:0xc8b797,roughness:.80,metalness:.03});
const foundryOrangeMat=new THREE.MeshStandardMaterial({color:0xd86625,roughness:.58,metalness:.10});
const foundryDarkMat=new THREE.MeshStandardMaterial({color:0x171817,roughness:.86,metalness:.03});
const droneGeo=new THREE.BoxGeometry(.045,.045,.045);
function buildFoundryIdentity(id,data){
  const root=C.RenderObject.get(id)?.object;if(!root)return;
  const apparatus=new THREE.Group();root.add(apparatus);
  const factory=new THREE.Group();factory.position.set(0,.555,0);apparatus.add(factory);
  const body=new THREE.Mesh(new THREE.BoxGeometry(.245,.195,.205),foundryBodyMat);
  // Preserve the old floor plane while adding breathing room above the bay.
  body.position.y=.094;body.castShadow=true;body.receiveShadow=true;factory.add(body);
  const cap=new THREE.Mesh(new THREE.BoxGeometry(.150,.040,.115),foundryOrangeMat);
  cap.position.set(0,.212,0);cap.castShadow=true;factory.add(cap);
  // At this scale a barely-proud black rectangle reads more reliably than literal recess geometry.
  const mouth=new THREE.Mesh(new THREE.BoxGeometry(.104,.072,.010),foundryDarkMat);
  mouth.position.set(0,.112,.108);mouth.castShadow=false;factory.add(mouth);
  foundryStates.set(id,{id,root,apparatus,factory,mouth,data,drones:[],nextLaunch:performance.now()+900});
}
for(const id of ecs.query(C.FoundryIdentity,C.RenderObject))buildFoundryIdentity(id,C.FoundryIdentity.get(id));

function foundryMouthWorld(st){
  st.mouth.updateWorldMatrix(true,false);return st.mouth.getWorldPosition(new THREE.Vector3());
}
function foundryMouthForward(st){
  st.mouth.updateWorldMatrix(true,false);
  return new THREE.Vector3(0,0,1).applyQuaternion(st.mouth.getWorldQuaternion(new THREE.Quaternion())).normalize();
}
function nearestUnclaimedRock(from){
  let best=null,bestD=Infinity;
  for(const r of spoil){
    if(r.delivered||r.claimedBy!=null||!r.mesh.visible)continue;
    const d=from.distanceToSquared(r.mesh.position);if(d<bestD){bestD=d;best=r}
  }
  return best;
}
function makeFoundryDrone(st){
  // Foundry drones are deliberately nothing more than little orange cubes.
  const g=new THREE.Group(),core=new THREE.Mesh(droneGeo,foundryOrangeMat);core.castShadow=true;g.add(core);
  const mouth=foundryMouthWorld(st),fwd=foundryMouthForward(st);g.position.copy(mouth).addScaledVector(fwd,.060);betwixtContent.add(g);
  const d={group:g,state:'seeking',rock:null,speed:.82,homeStage:null,launchStage:factoryFrontStage(st,.24),returnPath:[],returnIndex:0,returnAnchor:null};st.drones.push(d);return d;
}
function removeDeliveredRock(r){
  r.delivered=true;r.claimedBy=null;r.mesh.visible=false;r.mesh.removeFromParent();
}
let nextFoundryWake=performance.now()+500;
const FOUNDRY_DRONES_PER_FACTORY=15;
let lastFoundryNow=performance.now();
const DRONE_HALF_DIAG=Math.sqrt(3)*.045*.5;
const PRESENCE_COLLISION_RADIUS=.58+DRONE_HALF_DIAG+.008;
function presenceCollisionSpheres(){
  const out=[];
  for(const id of ecs.query(C.Presence,C.RenderObject)){
    const obj=C.RenderObject.get(id)?.object;if(!obj)continue;
    obj.updateWorldMatrix(true,false);
    out.push({id,center:obj.getWorldPosition(new THREE.Vector3()),r:PRESENCE_COLLISION_RADIUS});
  }
  return out;
}
function factoryFrontStage(st,extra=.24){
  // Derive the approach point from the factory's CURRENT world transform every frame.
  // The factory can move when its presence foregrounds/dismisses; drones never navigate to a stale world-space home.
  const mouth=foundryMouthWorld(st),fwd=foundryMouthForward(st);
  return mouth.clone().addScaledVector(fwd,extra);
}
function currentFactoryAnchor(st){
  // Single live home authority for every drone state.
  return {mouth:foundryMouthWorld(st),front:factoryFrontStage(st,.24)};
}

function factoryAvoidanceSphere(st){
  st.factory.updateWorldMatrix(true,true);
  const box=new THREE.Box3().setFromObject(st.factory);
  const center=box.getCenter(new THREE.Vector3());
  const half=box.getSize(new THREE.Vector3()).multiplyScalar(.5);
  // Deliberately generous: drones should visibly route around the little factory, not scrape it.
  return {center,r:Math.max(half.x,half.y,half.z)+DRONE_HALF_DIAG+.105};
}

function collisionAwareDirection(pos,target,ignoreFactoryIngress=false){
  const desired=target.clone().sub(pos),dist=desired.length();
  if(dist<1e-7)return {dir:new THREE.Vector3(),dist};
  const dir=desired.clone().multiplyScalar(1/dist);
  // Presence marbles are solid. If the direct step points through one, bend along its tangent instead.
  for(const s of presenceCollisionSpheres()){
    const rel=pos.clone().sub(s.center),rlen=rel.length();
    const toward=dir.dot(rel);
    const closest=rel.clone().addScaledVector(dir,-toward);
    if(toward<0 && closest.length()<s.r && -toward<dist+.18){
      const n=rlen>1e-6?rel.multiplyScalar(1/rlen):new THREE.Vector3(0,1,0);
      let tangent=dir.clone().addScaledVector(n,-dir.dot(n));
      if(tangent.lengthSq()<1e-6)tangent=new THREE.Vector3(0,1,0).cross(n);
      tangent.normalize();
      // Bias outward enough that a cube never clips the white surface while rounding it.
      return {dir:tangent.addScaledVector(n,.34).normalize(),dist};
    }
    if(rlen<s.r){
      return {dir:rel.normalize(),dist};
    }
  }
  if(!ignoreFactoryIngress){
    // Give every factory a broad keep-out volume. If a route intersects it, steer tangentially
    // around the volume with an outward bias. This prevents corner traps and visible wall-scraping.
    for(const st of foundryStates.values()){
      const guard=factoryAvoidanceSphere(st);
      const rel=pos.clone().sub(guard.center),rlen=rel.length();
      const toward=dir.dot(rel);
      const closest=rel.clone().addScaledVector(dir,-toward);
      if(rlen<guard.r){
        const n=rlen>1e-6?rel.multiplyScalar(1/rlen):foundryMouthForward(st);
        return {dir:n,dist};
      }
      if(toward<0 && closest.length()<guard.r && -toward<dist+.20){
        const n=rel.multiplyScalar(1/rlen);
        let tangent=dir.clone().addScaledVector(n,-dir.dot(n));
        if(tangent.lengthSq()<1e-6){
          tangent=foundryMouthForward(st).addScaledVector(n,-foundryMouthForward(st).dot(n));
          if(tangent.lengthSq()<1e-6)tangent=new THREE.Vector3(0,1,0).cross(n);
        }
        return {dir:tangent.normalize().addScaledVector(n,.62).normalize(),dist};
      }
    }
  }
  return {dir,dist};
}

function segmentSphereHit(a,b,s,margin=.055){
  const ab=b.clone().sub(a),len=ab.length();if(len<1e-6)return null;
  const dir=ab.clone().multiplyScalar(1/len),rel=a.clone().sub(s.center);
  const t=THREE.MathUtils.clamp(-rel.dot(dir),0,len);
  const closest=a.clone().addScaledVector(dir,t),off=closest.clone().sub(s.center);
  const rr=s.r+margin;if(off.lengthSq()>=rr*rr)return null;
  return {t,closest,off,rr};
}
function buildDronePath(start,end){
  // A path is a sequence of actual world-space waypoints, not a repeatedly perturbed direction.
  // Each obstructing marble earns one stable clearance waypoint; the drone then commits to it.
  const path=[],spheres=presenceCollisionSpheres();let cursor=start.clone();
  for(let guard=0;guard<12;guard++){
    let best=null,bestS=null;
    for(const s of spheres){
      const hit=segmentSphereHit(cursor,end,s);
      if(hit && hit.t>.025 && (!best || hit.t<best.t)){best=hit;bestS=s;}
    }
    if(!best)break;
    let out=best.off;
    if(out.lengthSq()<1e-8){
      const travel=end.clone().sub(cursor).normalize();
      out=new THREE.Vector3(0,1,0).cross(travel);
      if(out.lengthSq()<1e-8)out=new THREE.Vector3(1,0,0);

    const travel=end.clone().sub(cursor).normalize();
    const wp=bestS.center.clone().addScaledVector(out,best.rr+.085).addScaledVector(travel,.12);

}
function beginDroneReturn(d,st){

function refreshDroneReturnIfFactoryMoved(d,st){
  const front=currentFactoryAnchor(st).front;
  if(!d.returnAnchor || d.returnAnchor.distanceToSquared(front)>.0064){
    d.returnAnchor=front.clone();d.returnPath=buildDronePath(d.group.position,front);d.returnIndex=0;
  }else if(d.returnPath.length){
    d.returnPath[d.returnPath.length-1].copy(front);

function steerDroneToward(d,target,dt,speed,ignoreFactoryIngress=false){
  const steer=collisionAwareDirection(d.group.position,target,ignoreFactoryIngress);
  if(steer.dist>1e-7)d.group.position.addScaledVector(steer.dir,Math.min(steer.dist,speed*dt));
  return steer.dist;

function FoundrySystem(now){
  const dt=Math.min(.035,Math.max(.001,(now-lastFoundryNow)/1000));lastFoundryNow=now;
  let changed=false,nextWake=Infinity;
  for(const st of foundryStates.values()){
    // A factory owns fifteen cubes. Launches are staggered only for legibility; all fifteen may be active.
    if(now>=st.nextLaunch && st.drones.length<FOUNDRY_DRONES_PER_FACTORY){
      const mouth=foundryMouthWorld(st),rock=nearestUnclaimedRock(mouth);
      if(rock){
        const d=makeFoundryDrone(st);d.rock=rock;rock.claimedBy=d;
        // Claiming reserves the target only. It does NOT freeze it: falling rocks keep falling.
        d.state='launchClear';st.nextLaunch=now+115;changed=true;
      }else st.nextLaunch=now+180;
    }
    for(let i=st.drones.length-1;i>=0;i--){
      const d=st.drones[i];
      if(d.state==='launchClear' && d.rock && !d.rock.delivered){

function createJupurnRingField({parent,count=1600}){
  const geometry=new THREE.SphereGeometry(0.023,5,4);
  const material=new THREE.MeshStandardMaterial({color:0xb08d57,roughness:0.5,metalness:0.5});
  const mesh=new THREE.InstancedMesh(geometry,material,count);
  mesh.castShadow=true;parent.add(mesh);
  const bands=[
    {inner:1.18,outer:1.58,density:0.92,rate:0.105},
    {inner:1.72,outer:2.18,density:1.0,rate:0.086},
    {inner:2.34,outer:2.86,density:0.82,rate:0.069}
  ];
  const particles=[];let seed=0x51f15e;
  const random=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296};
  const weights=bands.map(b=>(b.outer-b.inner)*b.density),totalWeight=weights.reduce((a,b)=>a+b,0);
  for(let i=0;i<count;i++){
    let pick=random()*totalWeight,bandIndex=0;
    while(bandIndex<bands.length-1&&pick>weights[bandIndex])pick-=weights[bandIndex++];
    const band=bands[bandIndex],radius=band.inner+(band.outer-band.inner)*Math.sqrt(random());
    particles.push({
      radius,homeRadius:radius,angle:random()*Math.PI*2,
      rate:band.rate*Math.pow(band.inner/radius,1.5),
      verticalAmplitude:0.008+random()*0.025,
      verticalFrequency:0.22+random()*0.31,
      verticalPhase:random()*Math.PI*2,radialPhase:random()*Math.PI*2,
      disturbance:0,present:true,claimedBy:null,pull:0
    });
  }
  const dummy=new THREE.Object3D(),clearers=[];
  function addClearer(clearer){clearers.push(clearer)}
  function update(dt,timeSeconds){
    const positions=new Array(particles.length);
    for(let i=0;i<particles.length;i++){
      const p=particles[i];if(!p.present)continue;
      p.angle=(p.angle+p.rate*dt)%(Math.PI*2);
      const baseRadius=p.homeRadius+Math.sin(timeSeconds*0.12+p.radialPhase)*0.012;
      let disturbance=0;
      for(const clearer of clearers){
        const o=clearer.orbit,moonAngle=(o.phase??0)+timeSeconds*o.rate;
        const angularDelta=Math.atan2(Math.sin(p.angle-moonAngle),Math.cos(p.angle-moonAngle));
        const radialDelta=baseRadius-o.radius,distance=Math.hypot(radialDelta,angularDelta*o.radius);
        if(distance<clearer.influenceRadius){
          const strength=1-distance/clearer.influenceRadius;
          disturbance=Math.max(disturbance,strength);p.disturbance=Math.max(p.disturbance,strength);
        }
      }
      p.disturbance=Math.max(disturbance,p.disturbance-dt*0.34);
      const displacedRadius=baseRadius+p.disturbance*0.16*Math.sign(Math.sin(p.radialPhase)||1);
      positions[i]={
        x:Math.cos(p.angle)*displacedRadius,
        y:Math.sin(timeSeconds*p.verticalFrequency+p.verticalPhase)*p.verticalAmplitude+p.disturbance*0.035*Math.sin(p.angle*7+p.verticalPhase),
        z:Math.sin(p.angle)*displacedRadius
      };
    }
    for(let i=0;i<particles.length;i++){
      const p=particles[i],position=positions[i];
      if(!p.present||!position){dummy.position.set(0,-1000,0);dummy.scale.setScalar(0)}
      else{dummy.position.set(position.x,position.y,position.z);dummy.scale.setScalar(0.7+(i%9)*0.045)}
      dummy.updateMatrix();mesh.setMatrixAt(i,dummy.matrix);
    }
    mesh.instanceMatrix.needsUpdate=true;
  }
  return {mesh,particles,bands,addClearer,update};
}

function applyCamera(){
  phi=THREE.MathUtils.clamp(phi,.12,Math.PI-.12);
  radius=Math.max(.75,radius);
  camera.position.set(
    target.x+radius*Math.sin(phi)*Math.sin(theta),
    target.y+radius*Math.cos(phi),
    target.z+radius*Math.sin(phi)*Math.cos(theta)
  );
  // The dome is physical navigation grammar: neither camera nor panned target may
  // escape its usable interior. Preserve a margin so the boundary is approached,
  // never intersected.
  // Dome boundary: clamp travel along the current viewing ray so reaching the
  // boundary cannot rotate the camera. Continued pinch-out at the boundary is
  // therefore a spatial no-op rather than an angle change.
  const worldLen=camera.position.length();
  if(worldLen>CAMERA_BOUNDARY){
    const k=CAMERA_BOUNDARY/worldLen;
    camera.position.multiplyScalar(k);
    const off=camera.position.clone().sub(target);
    radius=off.length();
    phi=Math.acos(THREE.MathUtils.clamp(off.y/radius,-1,1));
    theta=Math.atan2(off.x,off.z);
  }
  camera.position.y=Math.max(GROUND_Y+.18,camera.position.y);
  const targetHorizontal=Math.hypot(target.x,target.z);
  if(targetHorizontal>CAMERA_BOUNDARY*.72){
    const k=CAMERA_BOUNDARY*.72/targetHorizontal;target.x*=k;target.z*=k;
  }
  camera.lookAt(target);
  window.vestibuleDirty=true;
}

function restoreFoundryState(saved,now){

  for(const fs of saved||[]){

      const d=makeFoundryDrone(st);d.group.position.fromArray(ds.position);d.state=ds.state||'seeking';d.speed=ds.speed||.82;
      d.returnPath=(ds.returnPath||[]).map(a=>new THREE.Vector3().fromArray(a));d.returnIndex=ds.returnIndex||0;d.returnAnchor=ds.returnAnchor?new THREE.Vector3().fromArray(ds.returnAnchor):null;

function restoreObserverState(o){

  if(o.cameraPosition)camera.position.fromArray(o.cameraPosition);if(o.target)target.fromArray(o.target);radius=o.radius??radius;theta=o.theta??theta;phi=o.phi??phi;camera.lookAt(target);

  if(id){const transform=C.Transform.get(id);if(o.selectedPosition)transform.position.fromArray(o.selectedPosition);RenderSyncSystem.sync();ecs.add(id,C.Foregrounded,true);selectedEntity=id;
    const q=o.observerReturn;ecs.add(id,C.ObserverReturn,q?{cameraPosition:new THREE.Vector3().fromArray(q.cameraPosition),target:new THREE.Vector3().fromArray(q.target),radius:q.radius,theta:q.theta,phi:q.phi}:{cameraPosition:HOME.camera.clone(),target:HOME.target.clone(),radius:HOME.radius,theta:HOME.theta,phi:HOME.phi});PreconnectSystem.begin(id)}

function validateWorldState(state){
  if(!state||state.version!==WORLD_STATE_VERSION)throw new Error('Incompatible WorldState schema');
  for(const key of ['descent','rocks','foundry','exchange'])if(state[key]!=null&&!Array.isArray(state[key]))throw new Error('Malformed WorldState '+key);
  const rockIds=new Set();
  for(const r of state.rocks||[]){
    if(!Number.isInteger(r.id)||r.id<=0||rockIds.has(r.id))throw new Error('Malformed or duplicate spoil identity');
    if(!Array.isArray(r.position)||r.position.length!==3||!r.position.every(Number.isFinite))throw new Error('Malformed spoil position');
    rockIds.add(r.id);
  }
  const claims=new Set();
  for(const f of state.foundry||[])for(const d of f.drones||[]){
    if(d.rockId==null)continue;
    if(!rockIds.has(d.rockId))continue; // orphaned drone is safely discarded by restore

function restoreCheckpointObserver(){
  let raw=null;try{raw=sessionStorage.getItem(WORLD_STATE_KEY)}catch(e){console.warn('WorldState observer restore unavailable',e)}if(!raw)return false;
  try{const state=validateWorldState(JSON.parse(raw));restoreObserverState(state.observer);return true}
  catch(e){console.warn('WorldState observer restore failed',e);return false}
}
function restoreWorldState(){
  let raw=null;try{raw=sessionStorage.getItem(WORLD_STATE_KEY)}catch(e){console.warn('WorldState restore unavailable',e)}if(!raw)return false;
  const now=performance.now(),fallback=captureWorldState(now);

function finishEntry(id){

  if(!destination){entryMotion=null;return}
  // Consume executable departure intent BEFORE navigation. A BFCache-restored page can never replay it.

function beginEntry(id){
  if(entryMotion||presenceMotion||!ecs.has(id,C.Destination))return;

    fromCamera:camera.position.clone(),fromTarget:target.clone(),

}
const SelectionSystem={
  pick(x,y){
    const r=canvas.getBoundingClientRect();

    raycaster.setFromCamera(pointerNDC,camera);

    for(const id of ecs.query(C.Selectable,C.RenderObject))
      if(C.Selectable.get(id).enabled)pickables.push(...C.RenderObject.get(id).pickables);
    for(const hit of raycaster.intersectObjects(pickables,false)){
      const id=hit.object.userData.entityId;      if(id&&ecs.has(id,C.Selectable))return id;
    }

  },
  tap(x,y){

  tapStarts.set(e.pointerId,{x:e.clientX,y:e.clientY,t:performance.now()});

});

  if(!pointers.has(e.pointerId))return;

    if(e.shiftKey||e.buttons===2)panPixels(e.clientX-old.x,e.clientY-old.y);
    else{theta-=(e.clientX-old.x)*.006;phi-=(e.clientY-old.y)*.006}

    const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),c=centroid(a);

renderer.setAnimationLoop((now)=>{

    return;
  }
  if(contentLiftMotion){
    const m=contentLiftMotion,raw=Math.min(1,(now-m.started)/m.duration),t=easeQuiet(raw);

  }

    const m=contentTinkerMotion,raw=Math.min(1,(now-m.started)/m.duration),t=easeQuiet(raw);

    betwixtContent.position.y=THREE.MathUtils.lerp(m.fromY,m.toY,t);
    window.vestibuleDirty=true;
    if(raw>=1){
      betwixtContent.scale.setScalar(m.toScale);betwixtContent.position.y=m.toY;
      contentTinkerMotion=null;
      contentGravityVelocity=0;
    }
  }else if(contentTinkered){

    const floorY=CONTENT_MARBLE_RADIUS;

      contentGravityVelocity+=CONTENT_GRAVITY*dt;

      if(betwixtContent.position.y<=floorY)contentGravityVelocity=0;

    k=idx(x0+1,z0);q=fx*(1-fz);hh=h[k];if(valid(k)&&hh>DRY){depth+=hh*q;u+=(hu[k]/hh)*q;v+=(hv[k]/hh)*q;w+=q}
    k=idx(x0,z0+1);q=(1-fx)*fz;hh=h[k];if(valid(k)&&hh>DRY){depth+=hh*q;u+=(hu[k]/hh)*q;v+=(hv[k]/hh)*q;w+=q}
    k=idx(x0+1,z0+1);q=fx*fz;hh=h[k];if(valid(k)&&hh>DRY){depth+=hh*q;u+=(hu[k]/hh)*q;v+=(hv[k]/hh)*q;w+=q}
    if(w<=1e-6)return false;out.depth=depth/w;out.u=u/w;out.v=v/w;return true;
  }
  // Compatibility surface for diagnostics and existing non-hot consumers.
  function sampleStateInto(x,z,out){const surface=surfaceY(x,z);if(!Number.isFinite(surface)||!flowInto(x,z,out))return false;out.surface=surface;return true}
  function sampleState(x,z){const out={depth:0,surface:0,u:0,v:0};return sampleStateInto(x,z,out)?out:null}
  function surfaceHeight(x,z){return surfaceY(x,z)}
  function forEachWetCell(fn){for(let z=0;z<N;z++)for(let x=0;x<N;x++){const k=idx(x,z);if(valid(k)&&h[k]>DRY)fn({ix:x,iz:z,x:wx(x),z:wz(z),depth:h[k],surface:bed[k]+h[k]})}}
  function captureDiagnostic(){
    const wetCells=[];
    for(let z=0;z<N;z++)for(let x=0;x<N;x++){const k=idx(x,z);if(h[k]<=DRY||!valid(k))continue;const px=wx(x),pz=wz(z),exactBed=terrain.groundHeightExact(px,pz);wetCells.push({ix:x,iz:z,x:px,z:pz,bed:bed[k],exactBed,bedError:Number.isFinite(exactBed)?bed[k]-exactBed:null,h:h[k],eta:bed[k]+h[k],hu:hu[k],hv:hv[k]});}
    const p=geometry.getAttribute("position"),index=geometry.getIndex(),vertices=p?Array.from(p.array):[],indices=index?Array.from(index.array):[];
    const triangles=[];for(let i=0;i<indices.length;i+=3){const ia=indices[i],ib=indices[i+1],ic=indices[i+2],a=ia*3,b=ib*3,c=ic*3;
      const ax=vertices[a],ay=vertices[a+1],az=vertices[a+2],bx=vertices[b],by=vertices[b+1],bz=vertices[b+2],cx=vertices[c],cy=vertices[c+1],cz=vertices[c+2];
      const abx=bx-ax,aby=by-ay,abz=bz-az,acx=cx-ax,acy=cy-ay,acz=cz-az,nx=aby*acz-abz*acy,ny=abz*acx-abx*acz,nz=abx*acy-aby*acx;
      const ea=terrain.groundHeightExact(ax,az),eb=terrain.groundHeightExact(bx,bz),ec=terrain.groundHeightExact(cx,cz);triangles.push({i:i/3,indices:[ia,ib,ic],a:[ax,ay,az],b:[bx,by,bz],c:[cx,cy,cz],exactTerrain:[ea,eb,ec],clearance:[ay-ea,by-eb,cy-ec],normal:[nx,ny,nz],spanXZ:Math.max(Math.hypot(ax-bx,az-bz),Math.hypot(bx-cx,bz-cz),Math.hypot(cx-ax,cz-az)),y:[Math.min(ay,by,cy),Math.max(ay,by,cy)]});

  }
  function inspect(){let volume=0,wet=0,maxDepth=0,maxSpeed=0;for(let k=0;k<K;k++)if(h[k]>DRY){wet++;volume+=h[k]*DX*DX;maxDepth=Math.max(maxDepth,h[k]);maxSpeed=Math.max(maxSpeed,Math.hypot(hu[k],hv[k])/h[k])}return{kind:`shallow-${kind}`,independent:true,enabled,grid:[N,N],cellSize:DX,sources:sources.map(s=>({...s})),display:{density:displayDensity,level:displayDensity,max:25},viscosity:{level:viscosityLevel,max:26,drag:.22*Math.pow(2,(viscosityLevel-1)/3)},water:{injected:totalInjected,volume,maxDepth,maxSpeed,escaped:totalEscaped,dryLoss:totalDryLoss,accounted:volume+totalEscaped+totalDryLoss,balanceError:totalInjected-(volume+totalEscaped+totalDryLoss)},wetCells:wet,steps,probe:probeFrame,presentation:{...presentationProbe}}}

  return{update,setEnabled,reset,inject,fillRegion,setSource,setSources,addTimedSource,cycleDisplayDensity,setDisplayDensity,cycleWaterLook,cycleViscosity,waterLook:()=>applyWaterLook(),surfaceY,flowInto,sampleState,sampleStateInto,surfaceHeight,forEachWetCell,captureDiagnostic,inspect,object:surface,sideObject:waterSide};
}

function createWorld(){
  let next=1;
  const alive=new Set(),stores=new Map();
  const component=name=>{if(!stores.has(name))stores.set(name,new Map());return stores.get(name)};
  const entity=()=>{const id=next++;alive.add(id);return id};
  const add=(id,store,value=true)=>{if(!alive.has(id))throw new Error(`dead entity ${id}`);store.set(id,value);return value};
  const remove=(id,store)=>store.delete(id);
  const query=(...parts)=>{if(!parts.length)return [...alive];const smallest=parts.reduce((a,b)=>a.size<=b.size?a:b);return [...smallest.keys()].filter(id=>alive.has(id)&&parts.every(p=>p.has(id)))};
  const destroy=id=>{alive.delete(id);for(const store of stores.values())store.delete(id)};
  return {component,entity,add,remove,query,destroy,alive,stores};
}



function attachBetwixtMirror(){
  const donor=globalThis.vestibule;
  if(!donor?.presences?.length)throw new Error("Betwixt presences unavailable for Repository mirror");

  const world=createWorld();
  const Identity=world.component("Identity");
  const Transform=world.component("Transform");
  const DonorPresence=world.component("DonorPresence");
  const entities=[];

  donor.presences.forEach((object,slot)=>{
    const id=world.entity();
    world.add(id,Identity,{kind:"betwixt-presence",slot,key:`betwixt-presence-${slot}`});
    world.add(id,Transform,{
      position:[object.position.x,object.position.y,object.position.z],
      rotation:[object.rotation.x,object.rotation.y,object.rotation.z],
      scale:[object.scale.x,object.scale.y,object.scale.z]
    });
    world.add(id,DonorPresence,{slot});
    entities.push(id);
  });

  function sample(){
    entities.forEach((id,slot)=>{
      const object=donor.presences[slot];
      const transform=Transform.get(id);
      transform.position[0]=object.position.x;
      transform.position[1]=object.position.y;
      transform.position[2]=object.position.z;
      transform.rotation[0]=object.rotation.x;
      transform.rotation[1]=object.rotation.y;
      transform.rotation[2]=object.rotation.z;
      transform.scale[0]=object.scale.x;
      transform.scale[1]=object.scale.y;
      transform.scale[2]=object.scale.z;
    });
  }

  function inspect(){
    sample();
    return entities.map(id=>({
      entity:id,
      identity:{...Identity.get(id)},
      transform:{
        position:[...Transform.get(id).position],
        rotation:[...Transform.get(id).rotation],
        scale:[...Transform.get(id).scale]
      }
    }));
  }

  const mirror={world,components:{Identity,Transform,DonorPresence},entities,sample,inspect};
  globalThis.RepositoryBetwixt={mirror};
  return mirror;
}

addEventListener("load",()=>attachBetwixtMirror(),{once:true});</script></body>
