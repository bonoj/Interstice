<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Betwixt</title>
<style>html,body{margin:0;width:100%;height:100%;background:#111;color:#ddd;font:600 13px/1.4 system-ui}body{display:grid;place-items:center}#s{padding:1rem}</style></head>
<body><div id="s">BETWIXT · resolving current build…</div>
<script>
(async()=>{
 const s=document.getElementById("s");
 try{
  const r=await fetch("./.repository-sha?resolve="+Date.now(),{cache:"no-store"});
  if(!r.ok)throw new Error("publication marker "+r.status);
  const sha=(await r.text()).trim();
  if(!/^[0-9a-f]{40}$/.test(sha))throw new Error("invalid publication marker");
  const build=sha.slice(0,8);
  s.textContent="BETWIXT · "+build+" · entering…";
  location.replace("./builds/"+build+".html");
 }catch(e){
  s.textContent="BETWIXT · publication identity unavailable · "+e.message;
 }
})();
</script></body></html>
