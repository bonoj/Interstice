<style>
:root{
  color-scheme:dark;

}

}

  z-index:40;width:min(250px,calc(100vw - 96px));
  display:grid;gap:8px;opacity:0;visibility:hidden;pointer-events:none;

}

}

#moleculeCard.visible{opacity:1;visibility:visible}#moleculeCard strong{display:block;font-size:15px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}#moleculeCard span{display:block;color:#343638}

<body data-repository-build="6586f64d" data-repository-sha="6586f64d80afc17eaa903786c31b925981dd886f"><script>globalThis.__REPOSITORY_SHA__="6586f64d80afc17eaa903786c31b925981dd886f";globalThis.__REPOSITORY_BUILD__="6586f64d";</script><script>(()=>{
  const place={sigil:"🌀",title:"BETWIXT"};
  const spells={
    temporary:[],
    resident:[
      {id:"refresh",text:"🔄",label:"Refresh",onClick:freshArrival},
      {id:"workshop",text:"🛠",label:"Workshop",onClick:toggleWorkshop}
    ]
  };
  const build=globalThis.__REPOSITORY_BUILD__||"local";
  const sha=globalThis.__REPOSITORY_SHA__||null;

  // A successful Pages deployment is not the same thing as a visitor receiving
  // the current document: browsers/CDNs may still reuse an older index.html.
  // Compare this executable's embedded provenance with the independently
  // published marker. If they disagree, force one SHA-keyed navigation so the
  // stale document cannot remain silently authoritative.
  async function reconcilePublishedBuild(){
    if(!sha||sha==="local"||location.protocol==="file:")return;
    try{
      const markerUrl=new URL(".repository-sha",location.href);
      markerUrl.searchParams.set("probe",Date.now().toString(36));
      const response=await fetch(markerUrl,{cache:"no-store"});
      if(!response.ok)return;
      const published=(await response.text()).trim();
      if(!/^[0-9a-f]{40}$/i.test(published)||published===sha)return;
      const current=new URL(location.href);
      if(current.searchParams.get("build")===published.slice(0,8))return;
      current.searchParams.set("build",published.slice(0,8));
      location.replace(current);
    }catch(error){
      console.warn("Repository provenance probe failed",error);
    }
  }
  reconcilePublishedBuild();

  const style=document.createElement("style");
  style.textContent=`
    #repository-status{position:fixed;z-index:90;left:max(.7rem,env(safe-area-inset-left));right:max(.7rem,env(safe-area-inset-right));top:max(.7rem,env(safe-area-inset-top));width:max-content;max-width:calc(100% - max(.7rem,env(safe-area-inset-left)) - max(.7rem,env(safe-area-inset-right)));box-sizing:border-box;padding:.45rem .6rem;border:1px solid #77736b40;border-radius:.45rem;background:#e7e2d8df;color:#4d4d49;font:600 11px/1.25 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;letter-spacing:.04em;pointer-events:none;box-shadow:0 3px 12px #5a514314;backdrop-filter:blur(4px)}
    #repository-devtools{position:fixed;z-index:90;inset:auto max(.6rem,env(safe-area-inset-right)) max(.6rem,env(safe-area-inset-bottom)) max(.6rem,env(safe-area-inset-left));box-sizing:border-box;display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;pointer-events:none}
    #repository-devtools .spell-tray{display:flex;flex-wrap:wrap;align-content:flex-end;gap:.28rem;max-width:calc(4 * 2.65rem + 3 * .28rem);pointer-events:auto}
    #repository-devtools .temporary{justify-content:flex-start}
    #repository-devtools .resident{justify-content:flex-start;flex-direction:row-reverse;margin-left:auto;flex:0 0 auto}
    #repository-devtools button{box-sizing:border-box;width:2.65rem;height:2.65rem;min-height:0;padding:0;border:1px solid #77736b55;border-radius:.45rem;background:#d9d6cf;color:#343638;font:1.25rem/1 system-ui,-apple-system,Segoe UI Emoji,sans-serif;touch-action:manipulation}
    #repository-devtools button.active{outline:1px solid #555;background:#cbc7be}
    #repository-devtools button.wide{grid-column:span 2;width:auto}
    #repository-devtools button.tall{grid-row:span 2;height:auto}
    #repository-devtools button.large{grid-column:span 2;grid-row:span 2;width:auto;height:auto;font-size:1.6rem}
    #repository-crucible{position:fixed;z-index:80;left:50%;top:50%;width:min(88vw,52rem);height:min(76dvh,44rem);transform:translate(-50%,-50%);border:1px solid #77736b66;border-radius:.7rem;background:#342820;box-shadow:0 1.2rem 4rem #0007;overflow:hidden}
    #repository-crucible iframe{display:block;width:100%;height:100%;border:0;background:#342820}
  `;
  document.head.append(style);

  const status=document.createElement("output");
  status.id="repository-status";
  status.textContent=`${place.sigil} ${place.title} · ${build} · … fps`;
  document.body.append(status);

  const tools=document.createElement("div");
  tools.id="repository-devtools";
  tools.setAttribute("aria-label","Repository tools");
  const temporaryTray=document.createElement("div");
  temporaryTray.className="spell-tray temporary";
  temporaryTray.setAttribute("aria-label","Temporary spells");
  const residentTray=document.createElement("div");
  residentTray.className="spell-tray resident";
  residentTray.setAttribute("aria-label","Resident spells");
  tools.append(temporaryTray,residentTray);
  document.body.append(tools);

  let fps=0,frames=0,stamp=performance.now();
  function sample(now){
    frames++;
    if(now-stamp>=500){
      fps=Math.round(frames*1000/(now-stamp));
      status.textContent=`${place.sigil} ${place.title} · ${build} · ${fps} fps`;
      frames=0;stamp=now;
    }
    requestAnimationFrame(sample);
  }
  requestAnimationFrame(sample);

  const registered=new Map();
  function registerTool({id,text,label,onClick,onDoubleClick,onLongPress,onContextMenu,active=false,size,lane="temporary"}){
    if(!id||registered.has(id))throw new Error(`Repository tool already registered: ${id}`);
    const button=document.createElement("button");
    button.type="button";
    button.textContent=text||"•";
    button.setAttribute("aria-label",label||id);
    button.classList.toggle("active",!!active);
    if(size)button.classList.add(size);
    if(onDoubleClick||onLongPress||onContextMenu){
      let pressTimer=null,lastTap=0,longFired=false;
      button.addEventListener("pointerdown",e=>{
        e.stopPropagation();longFired=false;
        if(onLongPress)pressTimer=setTimeout(()=>{pressTimer=null;longFired=true;onLongPress(button)},650);
      });
      button.addEventListener("pointerup",e=>{
        e.stopPropagation();if(pressTimer){clearTimeout(pressTimer);pressTimer=null}
        if(longFired)return;
        const now=performance.now();
        if(onDoubleClick&&now-lastTap<320){lastTap=0;onDoubleClick(button);return}
        lastTap=now;
        setTimeout(()=>{if(lastTap===now){onClick?.(button);lastTap=0}},onDoubleClick?330:0);
      });
      button.addEventListener("pointercancel",()=>{if(pressTimer)clearTimeout(pressTimer);pressTimer=null});
      button.addEventListener("contextmenu",e=>{if(onContextMenu){e.preventDefault();e.stopPropagation();onContextMenu(button)}});
    }else button.addEventListener("click",()=>onClick?.(button));
    registered.set(id,button);
    (lane==="resident"?residentTray:temporaryTray).append(button);
    return button;
  }
  function removeTool(id){
    registered.get(id)?.remove();
    registered.delete(id);
  }

  let crucibleAperture=null;
  function toggleCrucible(button){
    if(crucibleAperture){
      crucibleAperture.remove();
      crucibleAperture=null;
      button?.classList.remove("active");
      button?.setAttribute("aria-pressed","false");
      return false;
    }
    const host=document.createElement("section");
    host.id="repository-crucible";
    host.setAttribute("aria-label","Intact Crucible");
    const frame=document.createElement("iframe");
    frame.src="crucible/index.html";
    frame.title="Crucible";
    host.append(frame);
    document.body.append(host);
    crucibleAperture=host;
    button?.classList.add("active");
    button?.setAttribute("aria-pressed","true");
    return true;
  }

  function marbleBetwixtContent(button){
    const world=globalThis.vestibule;
    if(!world?.toggleContentTinkered||world.contentWorkshopHidden)return;
    const tinkered=world.toggleContentTinkered();
    button?.classList.toggle("active",tinkered);
    button?.setAttribute("aria-pressed",tinkered?"true":"false");
    const lift=registered.get("lift");
    if(lift){lift.classList.remove("active");lift.setAttribute("aria-pressed","false");lift.textContent="⬆️"}
  }

  function freshArrival(){
    try{sessionStorage.removeItem("worldLab.worldState.v1")}catch(_){}
    // Reset the live observer before navigation too. On mobile a same-document
    // replace can be satisfied from the current page/BFCache; the new document
    // will independently boot to the same home pose.
    globalThis.vestibule?.home?.();
    const url=new URL(location.href);
    for(const key of [...url.searchParams.keys()])if(key!=="build")url.searchParams.delete(key);
    url.searchParams.set("fresh",Date.now().toString(36));
    url.hash="";
    location.replace(url);
  }

  function toggleWorkshop(button){
    const world=globalThis.vestibule;
    if(!world?.toggleContentWorkshopHidden)return;
    const hidden=world.toggleContentWorkshopHidden();
    button?.classList.toggle("active",hidden);
    button?.setAttribute("aria-pressed",hidden?"true":"false");
    const lift=registered.get("lift");
    if(lift){lift.classList.remove("active");lift.setAttribute("aria-pressed","false");lift.textContent="⬆️"}
    const marble=registered.get("marble");
    marble?.classList.remove("active");marble?.setAttribute("aria-pressed","false");
  }

  function liftBetwixtContent(button){
    const world=globalThis.vestibule;
    if(!world?.toggleContentRaised||world.contentWorkshopHidden)return;
    if(world.contentTinkered)world.setContentTinkered(false);
    const raised=world.toggleContentRaised();
    button.textContent=raised?"⬇️":"⬆️";
    button?.classList.toggle("active",raised);
    button?.setAttribute("aria-pressed",raised?"true":"false");
    const marble=registered.get("marble");
    marble?.classList.remove("active");marble?.setAttribute("aria-pressed","false");
  }

  function toggleArcball(button){
    const world=globalThis.vestibule;if(!world?.toggleArcball)return;
    const active=world.toggleArcball();
    button?.classList.toggle("active",active);button?.setAttribute("aria-pressed",active?"true":"false");
  }
  function toggleFluidGlobes(button){
    const world=globalThis.vestibule;if(!world?.toggleFluidGlobes)return;
    const active=world.toggleFluidGlobes();
    button?.classList.toggle("active",active);button?.setAttribute("aria-pressed",active?"true":"false");
  }
  function toggleCrayon(button){
    const world=globalThis.vestibule;if(!world?.toggleCrayon)return;
    const active=world.toggleCrayon();
    button?.classList.toggle("active",active);button?.setAttribute("aria-pressed",active?"true":"false");
  }
  function clearCrayon(){globalThis.vestibule?.clearCrayon?.()}
  function exportCrayon(){globalThis.vestibule?.exportCrayon?.()}

  function spinPresences(){
    const world=globalThis.vestibule;
    if(!world?.presences?.length)return;
    const start=performance.now(),duration=1800,turns=2;
    const base=world.presences.map(o=>o.rotation.y);
    const tick=now=>{
      const raw=Math.min(1,(now-start)/duration);
      const t=1-Math.pow(1-raw,3);
      world.presences.forEach((o,i)=>{o.rotation.y=base[i]+Math.PI*2*turns*t});
      world.invalidate?.();
      if(raw<1)requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }

  for(const spell of spells.temporary)registerTool({...spell,lane:"temporary"});
  for(const spell of spells.resident)registerTool({...spell,lane:"resident"});

  // Betwixt now begins at the bench. Workshop is the sole manifested spell.
  // Wait for the donor to expose its world boundary, then enter exactly once.
  function enterWorkshopOnReady(){
    const world=globalThis.vestibule;
    if(!world?.setContentWorkshopHidden)return false;
    if(!world.contentWorkshopHidden)world.setContentWorkshopHidden(true);
    const button=registered.get("workshop");
    button?.classList.add("active");button?.setAttribute("aria-pressed","true");
    return true;
  }
  if(!enterWorkshopOnReady())addEventListener("vestibule-ready",enterWorkshopOnReady,{once:true});

  globalThis.RepositoryShell={
    place,
    spells,
    build,
    sha,
    status,
    devtools:tools,
    trays:{temporary:temporaryTray,resident:residentTray},
    registerTool,
    removeTool,
    button:id=>registered.get(id)||null,
    inspect:()=>({place:{...place},build,sha,fps,tools:[...registered.keys()]})
  };
})();</script>

<script type="text/plain" id="vestibule-semantics">
WORLD LAB VESTIBULE — SIX CITIES IDENTITY + CONTEXTUAL ACTIONS T0

VISIBLE COPY T41
Persistent display copy is reduced to WORLD LAB only. The former VESTIBULE · WORLDSPACE T0 subtitle and upper-right diagnostic/counter copy are retired.
T41 removed the counter DOM but left applyRing() writing directly to that retired node, and the visible startup diagnostics correctly caught the null textContent write. T42 removes that stale write while preserving ring/profile behavior. Contextual action labels remain interaction controls and appear only when a lab is foregrounded.

ROLE
The vestibule is a spatial threshold between the World Lab landing surface and
independent executable labs. It owns departure; each destination lab owns arrival.

WORLD SPACE
The current world is intentionally quiet and identity-neutral:
- a broad matte white-grey plane;
- a warm-neutral dome whose value remains close to, but distinct from, the plane;
- five identical presences hovering clearly above the plane;
- soft static shadows that establish the presences as things occupying a place.
- a centered static overhead skylight; no directional lighting movement.
- restrained distance fog begins only near the outer world, softening the floor/dome
  horizon without washing out the presences during ordinary or far inspection.
There are no paths, pedestals, landmarks, environmental animation, or moving light.
The dome is the lateral/upper visual extent and observer constraint. The floor is
also a hard observer boundary: the camera may approach it but never pass through it.
Zoom itself has no arbitrary near/far leash; observer travel is governed by the
physical world bounds instead. When pinch zoom reaches the dome boundary, continued
pinch-out is clamped along the same viewing direction and must not become orbit.

TOPOLOGY
Five presences occupy a circular ring around a shared center. The ring is phased edge-forward so the initial view meets the flat span between
two neighboring presences rather than a single vertex, without changing the earned
observer home pose. Ring earned itself
during the topology expedition and is now ordinary vestibule structure.

SELECTION GRAMMAR
- Tap a presence: it leaves its ring slot and travels toward the observer, settling
  8.5 world units in front of the camera with a slight camera-relative lift.
- Camera attention shifts to the arriving presence and remains locked to it.
- Pinch/wheel zoom and orbit remain available around the foregrounded presence.
- Selection snapshots the complete pre-selection observer pose.
- Tap away reverses the presence and restores that exact pose.
- A larger invisible interaction shell improves mobile acquisition without changing
  the visible presence.
- Only one presence can be foregrounded at a time.

CONTEXTUAL ACTIONS
Foregrounding an assigned lab reveals a small screen-space action stack anchored stably
at bottom center with safe-area breathing room. ENTER LAB is primary; GITHUB is secondary
provenance. The controls deliberately do not follow the physical presence: orbit and zoom
remain visually free so the user can inspect the project marble without UI jitter or pursuit.
Their fill matches the ground material, making the floor/substrate the visual source of
interface rather than introducing a separate HTML-white or glass layer.
Visibility is driven directly by foreground state. The unassigned control presence exposes
no actions.

ENTRY
ENTER LAB invokes the established Camera Commit: the observer moves rapidly toward the
foregrounded presence, then navigates to Destination. Navigation authority belongs to
the explicit contextual action rather than a second tap on the physical object.

ACTION-ANCHOR CORRECTION
A projected object-relative action tether was implemented and rejected under touch inspection:
small camera/orbit changes made the menu jitter and visually chase the marble. The action stack
is therefore viewport-owned, fixed at bottom center. Physical inspection and interface stability
are intentionally decoupled.

BACK / WORLD CONTINUITY
World Lab owns one versioned session WorldState. It persists semantic simulation state rather than
Three.js representation: observer/focus state; Vertical Accretion route, stock/path progress, worker
run, RNG and spoil physics; Foundry drones plus stable references to shared spoil; and Six Cities
exchange scheduler, RNG and active packet progression. Meshes/groups remain disposable views and are
reconstructed from that state when the document is rebuilt. BFCache may preserve the live ECS world
as an optimization, but it no longer defines continuity.

WorldState is a continuity boundary, not a new owner of every simulation. Each identity system retains
its behavioral authority. Cross-system coupling occurs through the smallest shared semantic facts that
have earned persistence. The current important example is spoil: Vertical Accretion produces physical
spoil with stable identity; Foundry may independently claim, carry, and remove that same spoil; WorldState
preserves the identity and relationship without making either system own the other's behavior. Stable
identity is introduced only where restoration of a real relationship requires it.

Navigation is deliberately outside WorldState. ENTER LAB checkpoints the stable inspection state
before Camera Commit, then Camera Commit runs. finishEntry consumes
entryMotion before assigning location.href. A BFCache return therefore cannot resume a completed
Camera Commit and phantom-enter the same lab. pagehide/visibility lifecycle saves are suppressed only once navigation begins
during sealed departure so the terminal commit camera cannot overwrite the inspection checkpoint.
On pageshow from BFCache only ephemeral motion/departure state is cleared; on document reconstruction
the versioned WorldState rebuilds meaningful world identity. Session storage intentionally limits
continuity to the current tab/session rather than creating a permanent save game.

CONTINUITY ARCHAEOLOGY
The predecessor used a one-shot return snapshot containing only foreground presence and observer pose.
That solved reconstructed Back framing but left simulation identity dependent on BFCache. More
importantly, Camera Commit left its completed entryMotion live across navigation. BFCache restored that
executable departure intent; the resumed animation loop immediately called finishEntry again, producing
the observed World Lab flash followed by automatic re-entry and a damaged-feeling Back sequence.
The repair separates durable world state from ephemeral commands and makes departure exactly-once.

APPARATUS UI RETIREMENT
The persistent lower-right Home/apparatus control was removed after camera interaction became
bounded, reversible, and transactionally restored by the selection grammar. The user no longer
needs a recovery control for ordinary camera exploration; permanent chrome would only advertise
a failure mode the apparatus has already solved.
The first retirement pass removed the Home DOM node but left a later direct onclick binding,
which correctly failed visibly at startup. That stale binding was removed; the programmatic
home() helper may remain available for diagnostics without requiring visible UI.

PRECONNECT
Foreground focus is a declaration of interest. If the entity owns a Destination,
the vestibule preconnects to its origin. This is intentionally the only preload
behavior: the preload expedition found speculative destination execution harmful
to vestibule frame rate and not meaningfully beneficial to arrival. Lab startup
experience belongs to the lab.

ECS OWNERSHIP
The vestibule uses a deliberately minimal ECS substrate.
Entity identity and semantic components are independent of rendering. Transform owns
world data. Three.js Object3D instances live only in RenderObject. RenderSyncSystem is
the one-way bridge from authoritative data to views. Views remain dumb.
LabIdentity and Destination own lab information; no lab-specific view classes exist.
ExchangeIdentity owns the first project-derived behavioral vocabulary. A generic
ExchangeSystem materializes its fittings and packet traffic; the Six Cities entity
supplies only data.

IDENTITY PROBE — SIX CITIES
Six Cities alone has earned a first physical mutation while the other presences remain
neutral controls. Its neutral sphere is retained. Six small octagonal metal fittings
are attached at the four equatorial cardinal points and two poles. Sparse deterministic
five-bearing material packets travel on raised spherical arcs between fittings. Each
packet is a clearly separated five-bearing train with the size rhythm
teeny -> tiny -> small -> tiny -> teeny. The center is the largest bearing, but even
it remains smaller than the previous probe's largest bearings. Each bearing owns its
own passage lifecycle: it appears only when its staggered departure begins, traverses
the complete arc at the common packet speed, and disappears individually on reaching
the destination fitting. Route ownership persists until the final bearing arrives.
Packets choose deterministically among four terrain-derived material colors: forest
green, warm sand/gold, pale stone, and water cyan. The underlying Six Cities presence remains the same opaque neutral white sphere as every
other project presence. Its fittings are bright warm honey-brass, deliberately biased by
material color rather than scene lighting. Each of the six octagonal fittings carries its
own tiny translucent light-blue glass dome, derived from Reservoir City's containment
architecture. Each dome is constructed from the brass interface rather than independently:
each dome is a true hemisphere whose diameter is deliberately narrower than the
octonut top, leaving a slim breathing annulus of warm brass around the glass. Its
equatorial rim plane sits slightly below the brass top face, so the dome remains
physically socketed with no hover gap. These are local structures attached to the six loci, not a shell around the
whole project orb. Other project presences remain opaque neutral white controls. Bearings, fittings, and
shell participate in the scene's physical lighting and shadows.

Implementation archaeology: the first shell probe attempted to access RenderObject
during entity construction before that component had been installed, causing startup
to fail visibly. Shell appearance/materialization now occurs in the post-construction
ExchangeIdentity + RenderObject pass, preserving component ownership and startup order.
That whole-orb shell interpretation was subsequently rejected: the canonical white
presence is restored unchanged. Translucency now belongs only to six tiny hemispherical
domes mounted on the brass fittings.
Traffic is intentionally lumpy but somewhat busier: quiet gaps, isolated transfers,
and occasional simultaneous exchanges. Orthogonal/nonintersecting routes may overlap in
time; only physically conflicting arc crossings are reserved out. There are no labels,
trails, glows, miniature scenery, or explanatory UI. The mechanism is evidence of six loci exchanging matter, not an
illustration of six cities.


IDENTITY PROBE — FOUNDRY T2
Foundry retains the canonical neutral white presence. Its first physical tether is a deliberately
tiny beige drone factory socketed into the marble: squat warm-beige body, orange cap, and a black
rectangular front mouth represented by an almost-flush outset. The previously proposed side poles
were rejected as visual invention and removed.

The factory now earns one verb: retrieve. Fifteen little orange true-cube drones belong to each factory. They emerge from the black mouth, claim
the nearest unclaimed Vertical Accretion spoil rock, and actively pursue that physical rock even while
it is still falling or bouncing. Claiming reserves a target but does not freeze its physics. On contact,
the drone picks up that same object and carries it home. Drones treat presence surfaces and the factory as solid obstacles, round them rather than clipping through them, and return through a broad front-door staging corridor before entering the black mouth, giving the factory a visibly generous berth and preventing corner traps. The rock leaves the world only at the factory mouth. Cargo return is an explicit world-space waypoint path around obstructing presence spheres; generic tangent repulsion is not used after pickup. The terminal factory approach remains live and the route is rebuilt if the Foundry presence materially moves. The factory body grows upward while its seated floor plane stays fixed, giving the black bay more vertical breathing room.
Claims prevent dogpiling. No processing or output is implied yet.

ARCHAEOLOGY — FOUNDRY IDENTITY
The older Foundry world supplies perceptual grammar rather than a scene to reproduce. Towers,
lavender structures, cable machinery, terrain, and processing systems remain withheld. T1 made the
factory too large and added unsupported skinny side poles; both were rejected. T2 makes the factory
smaller and beiger, removes the poles, and lets retrieval behavior carry the identity.

IDENTITY PROBE — ORBITAL CONSTRUCTION T1
Orbital Construction retains the canonical neutral white presence, but its project identity does not
sit on the marble. A distilled station orbits around it. The station is derived from the actual
Orbital Construction lab vocabulary: a compact pale-grey central hub, orthogonal cylindrical pressure
arms, asymmetric boxy habitation/workshop masses, a vertical mast, dark readable collars/structure,
very thin orange routed pipes/rails, and a few tiny warm inhabited windows. It is intentionally not a
miniature catalog of all thirty-seven module kinds and does not reproduce a finished composition.
The station follows a slow wandering elliptical orbit with no visible orbit line. The ellipse plane,
eccentricity, and attitude drift gently and independently over long periods, so the construction reads
from changing aspects without becoming frantic. The marble remains the canonical presence substrate;
the station is the lab's first identity evidence in the space around it.

ARCHAEOLOGY — ORBITAL IDENTITY
The source lab's executable and semantic surface were inspected before this probe. Earned visual
grammar includes cool white/light-grey hulls, dark readable mechanical structure, orthogonal modular
construction, thin orange framework/service routing, and scarce warm inhabited interiors. The vestibule
does not import scene-specific machinery, module encyclopedias, or unearned construction behavior.

IDENTITY PROBE — VERTICAL ACCRETION T28
Vertical Accretion retains the canonical neutral white presence. A small block worker begins
at a deterministic pseudo-random staging point with a broad finite pile of seventy-two actual
wooden steps. The worker may not shortcut across the sphere to fetch material: every supply
run retraces the graph of steps already constructed. He walks frontier -> built graph -> stock,
carries one plank back across that same graph, and only then installs the new transverse step.
The growing path therefore makes its own extension progressively more expensive in travel.
A tiny torch begins beside each woodpile/restock site. Sparse additional torches are finite infrastructure attached to the path and cast tiny local illumination.
When stock is exhausted, the worker retraverses the graph to its frontier, removes the final
step, carries it home over the graph that remains, and repeats until the topology collapses
back to the stockpile. He then chooses another deterministic pseudo-random staging route and
starts again. The worker is a pictographic cream figure with a sphere head, subtly tapered cylinder body,
no arms, and two nearly adjacent stubby grey legs slightly aft of centerline. Large warm-white spoil bearings use the original
legible rubble scale, remain persistent physical consequence, and deliberately cast no shadows.

ARCHAEOLOGY — VERTICAL ACCRETION IDENTITY
Dark excavation channels failed to read as true cuts at marble scale. Permanent cuts and
torches also accumulated toward ornamental end states. A direct stock-to-frontier spherical
shuttle then exposed a deeper lie: finite lumber was physical, but the worker ignored the
access topology it created. T27 makes constructed steps authoritative traversal edges. The
worker now pays the logistics cost of his own growing graph; dismantling is its physical inverse.

LAB ENTITIES
Four presences currently own destinations:
- Foundry -> https://bonoj.github.io/Foundry/
- Six Cities -> https://bonoj.github.io/SixCities/
- Vertical Accretion -> https://bonoj.github.io/VerticalAccretion/
- Orbital Construction -> https://bonoj.github.io/OrbitalConstruction/
The fifth presence remains deliberately unassigned and is not pre-named.

ARCHAEOLOGY
A 16-layout probe earned Ring. Transition probes earned Camera Commit. Preload probes
compared none, preconnect, document prefetch, and warm iframe; Preconnect earned
promotion. Warm iframe caused severe transient frame-rate collapse and did not improve
the destination's meaningful render time. Experimental selectors and alternate
implementations were removed after promotion rather than retained as dormant product UI.

RUNTIME
Dirty-on-change rendering except during bounded motion. Pixel ratio capped at 1.5.
Startup/runtime/promise/WebGL/shader failures remain visibly diagnostic.

WORKING RULE
Attention brings a presence to the observer. Commitment carries the observer to the lab.

/* Relational construction T0
   Authoritative representation is a tiny semantic graph. Three.js is only projection.
   Chemistry is the first consumer, not the owner of this grammar. */
const RelationalBuild=Object.freeze({
  // Canonical presentation frame: one tetrahedral port is +Y ("point up"),
  // the other three form the equivalent lower tripod. Orientation is deterministic
  // presentation grammar, not chemistry semantics.
  tetrahedral:Object.freeze([
    new THREE.Vector3(0,1,0),
    new THREE.Vector3(Math.sqrt(8/9),-1/3,0),
    new THREE.Vector3(-Math.sqrt(2/9),-1/3, Math.sqrt(2/3)),
    new THREE.Vector3(-Math.sqrt(2/9),-1/3,-Math.sqrt(2/3))
  ]),
  pyramidal(angleDegrees=106.7){
    const dot=Math.cos(THREE.MathUtils.degToRad(angleDegrees));
    const y=Math.sqrt((1+2*dot)/3),r=Math.sqrt(1-y*y);
    return [0,1,2].map(i=>new THREE.Vector3(r*Math.cos(i*Math.PI*2/3),-y,r*Math.sin(i*Math.PI*2/3)));
  },
  bent(angleDegrees=104.5){
    const half=THREE.MathUtils.degToRad(angleDegrees*.5);
    return [
      new THREE.Vector3(-Math.sin(half),Math.cos(half),0),
      new THREE.Vector3( Math.sin(half),Math.cos(half),0)
    ];
  },
  linear:Object.freeze([
    new THREE.Vector3(-1,0,0),
    new THREE.Vector3( 1,0,0)
  ]),
  trigonalChildren(parentDirection,planeAxis=null){
    const back=parentDirection.clone().negate().normalize();
    const u=planeAxis
      ? planeAxis.clone().addScaledVector(back,-planeAxis.dot(back)).normalize()
      : new THREE.Vector3().crossVectors(Math.abs(back.y)<.9?new THREE.Vector3(0,1,0):new THREE.Vector3(1,0,0),back).normalize();
    // Experimental ethylene is slightly opened at C-C-H (~121.5 deg), so the
    // two C-H directions are symmetric in the same plane around the C-C axis.
    const a=THREE.MathUtils.degToRad(121.55);
    return [
      back.clone().multiplyScalar(Math.cos(a)).addScaledVector(u, Math.sin(a)).normalize(),
      back.clone().multiplyScalar(Math.cos(a)).addScaledVector(u,-Math.sin(a)).normalize()
    ];
  },
  tetrahedralChildren(parentDirection,torsionDegrees=0){
    const back=parentDirection.clone().negate().normalize();
    const helper=Math.abs(back.y)<.9?new THREE.Vector3(0,1,0):new THREE.Vector3(1,0,0);
    const u=new THREE.Vector3().crossVectors(helper,back).normalize();
    const v=new THREE.Vector3().crossVectors(back,u).normalize();
    const phase=THREE.MathUtils.degToRad(torsionDegrees);
    return [0,1,2].map(i=>{
      const a=phase+i*Math.PI*2/3;
      return back.clone().multiplyScalar(-1/3)
        .addScaledVector(u,Math.sqrt(8/9)*Math.cos(a))
        .addScaledVector(v,Math.sqrt(8/9)*Math.sin(a)).normalize();
    });
  },
  project(graph,{bondLength=.48}={}){
    const positions=new Map(),rootId=graph.root||graph.nodes[0]?.id;
    positions.set(rootId,new THREE.Vector3());
    const outgoing=new Map();
    for(const edge of graph.edges){
      if(!outgoing.has(edge.from))outgoing.set(edge.from,[]);
      outgoing.get(edge.from).push(edge);
    }
    const visit=(id,heading=new THREE.Vector3(0,1,0))=>{
      const base=positions.get(id),edges=outgoing.get(id)||[];
      const node=graph.nodes.find(n=>n.id===id);
      const dirs=node?.projection==='trigonal-root'
        ? [new THREE.Vector3(0,1,0),
           new THREE.Vector3( Math.sin(THREE.MathUtils.degToRad(121.55)),Math.cos(THREE.MathUtils.degToRad(121.55)),0),
           new THREE.Vector3(-Math.sin(THREE.MathUtils.degToRad(121.55)),Math.cos(THREE.MathUtils.degToRad(121.55)),0)]
        : node?.projection==='tetrahedral'
        ? this.tetrahedral
        : node?.projection==='trigonal-local'
          ? this.trigonalChildren(heading,node.planeAxis?new THREE.Vector3(...node.planeAxis):null)
          : node?.projection==='tetrahedral-local'
          ? this.tetrahedralChildren(heading,node.torsionDegrees??0)
          : node?.projection==='pyramidal'
          ? this.pyramidal(node.angleDegrees??106.7)
          : node?.projection==='bent'
          ? this.bent(node.angleDegrees??104.5)
          : node?.projection==='linear-local'
            ? [heading.clone()]
          : node?.projection==='linear'
            ? this.linear
            : edges.map((_,i)=>new THREE.Vector3(Math.cos(i*Math.PI*2/Math.max(1,edges.length)),0,Math.sin(i*Math.PI*2/Math.max(1,edges.length))));
      edges.forEach((edge,i)=>{
        if(positions.has(edge.to))return;
        const dir=(dirs[i]||heading).clone().normalize();
        positions.set(edge.to,base.clone().addScaledVector(dir,edge.length||bondLength));
        visit(edge.to,dir);
      });
    };
    visit(rootId);
    return {graph,positions};
  },
  materialize(projected,parent,{atomRadius=.115,bondRadius=.025}={}){
    const group=new THREE.Group();group.name='relational-build:'+projected.graph.name;parent.add(group);
    const nodeById=new Map(projected.graph.nodes.map(n=>[n.id,n]));
    const mats={
      carbon:new THREE.MeshStandardMaterial({color:0x303437,roughness:.42,metalness:.08}),
      oxygen:new THREE.MeshStandardMaterial({color:0xc83d32,roughness:.42,metalness:.04}),
      nitrogen:new THREE.MeshStandardMaterial({color:0x3659b8,roughness:.42,metalness:.04}),
      hydrogen:new THREE.MeshStandardMaterial({color:0xf1eee6,roughness:.52,metalness:.02}),
      neutral:new THREE.MeshStandardMaterial({color:0xb7b8b4,roughness:.48,metalness:.04}),
      bond:new THREE.MeshStandardMaterial({color:0x747b7d,roughness:.40,metalness:.18})
    };
    for(const [id,p] of projected.positions){
      const node=nodeById.get(id),r=(node?.radius||1)*atomRadius;
      const m=new THREE.Mesh(new THREE.SphereGeometry(r,16,10),mats[node?.kind]||mats.neutral);
      m.position.copy(p);m.castShadow=true;m.userData.relationalNode=id;group.add(m);
    }
    for(const edge of projected.graph.edges){
      const a=projected.positions.get(edge.from),b=projected.positions.get(edge.to);if(!a||!b)continue;
      const d=b.clone().sub(a),len=d.length(),m=new THREE.Mesh(new THREE.CylinderGeometry(bondRadius,bondRadius,len,8),mats.bond);
      m.position.copy(a).add(b).multiplyScalar(.5);
      m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());
      m.userData.relationalConnection=edge.kind||'connection';group.add(m);
    }
    group.userData.relational=projected.graph;return group;
  }
});

const GeometryVerifier=Object.freeze({
  angle(projected,a,center,b){
    const p=projected.positions;
    const u=p.get(a).clone().sub(p.get(center)).normalize();
    const v=p.get(b).clone().sub(p.get(center)).normalize();
    return THREE.MathUtils.radToDeg(Math.acos(THREE.MathUtils.clamp(u.dot(v),-1,1)));
  },
  bondOrder(graph,a,b){
    return graph.edges.find(e=>(e.from===a&&e.to===b)||(e.from===b&&e.to===a))?.order??0;
  },
  coplanar(projected,ids,tolerance=1e-6){
    const p=projected.positions,origin=p.get(ids[0]);
    let normal=null;
    for(let i=1;i<ids.length-1&&!normal;i++)for(let j=i+1;j<ids.length&&!normal;j++){
      const n=p.get(ids[i]).clone().sub(origin).cross(p.get(ids[j]).clone().sub(origin));
      if(n.lengthSq()>1e-12)normal=n.normalize();
    }
    if(!normal)return true;
    return ids.every(id=>Math.abs(p.get(id).clone().sub(origin).dot(normal))<=tolerance);
  },
  run(graph,checks){
    const projected=RelationalBuild.project(graph),results=[];
    const near=(actual,expected,tolerance)=>Math.abs(actual-expected)<=tolerance;
    for(const check of checks){
      let actual,pass=false;
      if(check.kind==='angle'){actual=this.angle(projected,check.a,check.center,check.b);pass=near(actual,check.expected,check.tolerance??.1);}
      else if(check.kind==='bondOrder'){actual=this.bondOrder(graph,check.a,check.b);pass=actual===check.expected;}
      else if(check.kind==='coplanar'){actual=this.coplanar(projected,check.ids,check.tolerance);pass=actual===check.expected;}
      results.push({...check,actual,pass});
    }
    return {name:graph.name,pass:results.every(r=>r.pass),results,projected};
  }
});

// Octagonal prism whose FINAL local bounding box is exactly n × n × n.
// CylinderGeometry's radius is circumradius, so compensate for the octagon's flat-to-flat span.
function makeOctonut(n=.42){

  if(Math.abs(measured.x-n)>eps||Math.abs(measured.y-n)>eps||Math.abs(measured.z-n)>eps)

}

  // escape its usable interior. Preserve a margin so the boundary is approached,

function createBearingSystem({world,components,THREE,scene,terrain,locus,impacts,water=null,liquids=null,maxBearings=1000000}){

function createWorld(){
  let next=1;
  const alive=new Set(),stores=new Map();
  const component=name=>{if(!stores.has(name))stores.set(name,new Map());return stores.get(name)};
  const entity=()=>{const id=next++;alive.add(id);return id};
  const add=(id,store,value=true)=>{if(!alive.has(id))throw new Error(`dead entity ${id}`);store.set(id,value);return value};
  const remove=(id,store)=>store.delete(id);
  const query=(...parts)=>{if(!parts.length)return [...alive];const smallest=parts.reduce((a,b)=>a.size<=b.size?a:b);return [...smallest.keys()].filter(id=>alive.has(id)&&parts.every(p=>p.has(id)))};
  const destroy=id=>{alive.delete(id);for(const store of stores.values())store.delete(id)};
  return {component,entity,add,remove,query,destroy,alive,stores};
}



function attachBetwixtMirror(){
  const donor=globalThis.vestibule;
  if(!donor?.presences?.length)throw new Error("Betwixt presences unavailable for Repository mirror");

  const world=createWorld();
  const Identity=world.component("Identity");
  const Transform=world.component("Transform");
  const DonorPresence=world.component("DonorPresence");
  const entities=[];

  donor.presences.forEach((object,slot)=>{
    const id=world.entity();
    world.add(id,Identity,{kind:"betwixt-presence",slot,key:`betwixt-presence-${slot}`});
    world.add(id,Transform,{
      position:[object.position.x,object.position.y,object.position.z],
      rotation:[object.rotation.x,object.rotation.y,object.rotation.z],
      scale:[object.scale.x,object.scale.y,object.scale.z]
    });
    world.add(id,DonorPresence,{slot});
    entities.push(id);
  });

  function sample(){
    entities.forEach((id,slot)=>{
      const object=donor.presences[slot];
      const transform=Transform.get(id);
      transform.position[0]=object.position.x;
      transform.position[1]=object.position.y;
      transform.position[2]=object.position.z;
      transform.rotation[0]=object.rotation.x;
      transform.rotation[1]=object.rotation.y;
      transform.rotation[2]=object.rotation.z;
      transform.scale[0]=object.scale.x;
      transform.scale[1]=object.scale.y;
      transform.scale[2]=object.scale.z;
    });
  }

  function inspect(){
    sample();
    return entities.map(id=>({
      entity:id,
      identity:{...Identity.get(id)},
      transform:{
        position:[...Transform.get(id).position],
        rotation:[...Transform.get(id).rotation],
        scale:[...Transform.get(id).scale]
      }
    }));
  }

  const mirror={world,components:{Identity,Transform,DonorPresence},entities,sample,inspect};
  globalThis.RepositoryBetwixt={mirror};
  return mirror;
}

(function attachMirrorWhenReady(){if(globalThis.vestibuleReady&&globalThis.vestibule?.presences?.length){attachBetwixtMirror();return}addEventListener("vestibule-ready",attachMirrorWhenReady,{once:true})})();</script></body>
